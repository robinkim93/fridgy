# Fly.io 배포 설정 (무료 소형 머신). `fly launch` 후 app 이름·region 조정.
app = "fridgy-api"
primary_region = "nrt"  # Tokyo (국내 지연 최소)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"    # 무사용 시 정지 → $0 유지
  auto_start_machines = true
  min_machines_running = 0

  [http_service.checks]
    [[http_service.checks.http]]
      method = "GET"
      path = "/health"
      interval = "30s"
      timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
